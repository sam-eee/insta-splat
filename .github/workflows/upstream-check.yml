name: Upstream check
# Weekly: do the Spirula flags we use still exist on Spirula's latest master?
on:
  schedule: [{cron: "0 6 * * 1"}]
  workflow_dispatch:
jobs:
  pinned:
    name: Pinned release still matches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: git clone --depth 1 --branch "$(tr -d '\r\n ' < SPIRULA_VERSION)" https://github.com/harry7557558/spirula-studio spirula-src
      - run: SPIRULA_SRC=spirula-src python -m unittest tests.test_contract -v
  latest:
    name: Spirula master (early warning for the next upgrade)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: git clone --depth 1 https://github.com/harry7557558/spirula-studio spirula-src
      - run: SPIRULA_SRC=spirula-src python -m unittest tests.test_contract -v
