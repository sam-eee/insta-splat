name: Build apps
# Builds the single-file app for Windows, macOS and Linux with Spirula bundled inside.
# Run manually for test builds. Pushing a tag like v0.1.0 also publishes a GitHub release
# with the apps, both source archives (GPLv3 source offer) and checksums.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, asset: windows-vulkan-x86_64.zip, out: SphereScan-windows.zip, key: windows}
          - {os: ubuntu-latest,  asset: ubuntu-vulkan-x86_64.zip,  out: SphereScan-linux.zip,   key: linux}
          - {os: macos-latest,   asset: macos-vulkan-arm64.dmg,    out: SphereScan-macos.zip,   key: macos}
    runs-on: ${{ matrix.os }}
    defaults: {run: {shell: bash}}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Fetch the pinned Spirula release (unmodified)
        run: |
          TAG=$(tr -d '\r\n ' < SPIRULA_VERSION)
          mkdir -p dl vendor/spirula
          gh release download "$TAG" -R harry7557558/spirula-studio -p "*${{ matrix.asset }}" -D dl
          ls -l dl
          case "${{ matrix.asset }}" in
            *.zip) 7z x -y -ovendor/spirula dl/*.zip >/dev/null ;;
            *.dmg) hdiutil attach dl/*.dmg -mountpoint /Volumes/spirula -nobrowse -quiet
                   cp -R /Volumes/spirula/*.app vendor/spirula/
                   hdiutil detach /Volumes/spirula -quiet ;;
          esac
          find vendor -maxdepth 4 | head -30
          (cd dl && python -c "import hashlib,sys,glob;[print(hashlib.sha256(open(f,'rb').read()).hexdigest(),f) for f in sorted(glob.glob('*'))]") | tee "spirula-asset-${{ matrix.key }}.sha256"
      - name: Bundle the OpenGL helper library Spirula needs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y libopengl0
          mkdir -p vendor/libs vendor/licenses/libglvnd
          cp -a /usr/lib/x86_64-linux-gnu/libOpenGL.so.0* vendor/libs/
          cp /usr/share/doc/libopengl0/copyright vendor/licenses/libglvnd/copyright
      - name: Bundle Spirula's licences
        run: python scripts/fetch_spirula_legal.py "$(tr -d '\r\n ' < SPIRULA_VERSION)" vendor/licenses/spirula-studio
      - name: Build
        run: |
          python -m pip install pyinstaller
          python build.py
      - name: Smoke test the built app (Linux)
        if: runner.os == 'Linux'
        run: ./dist/SphereScan hardware | tail -3
      - name: Package with portable.txt next to the app
        run: |
          printf '%s\n' "This file makes SphereScan portable: it keeps its settings in a SphereScan-data folder next to the app" "instead of your user folder, so the whole thing can live on a USB stick or any folder." "Delete this file to use SphereScan like a normal app." > dist/portable.txt
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            mkdir stage && mv SphereScan.app stage/ && cp portable.txt stage/
            (cd stage && ditto -c -k . ../../${{ matrix.out }})
          else
            7z a ../${{ matrix.out }} SphereScan* portable.txt >/dev/null
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}
          path: |
            ${{ matrix.out }}
            spirula-asset-${{ matrix.key }}.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with: {path: assets, merge-multiple: true}
      - name: Source archives (GPLv3 corresponding source)
        run: |
          SP=$(tr -d '\r\n ' < SPIRULA_VERSION)
          mkdir -p assets
          python scripts/fetch_spirula_legal.py "$SP" /tmp/spirula-licences --save-source assets
          git archive --format=tar.gz -o "assets/spherescan-${{ github.ref_name }}-source.tar.gz" HEAD
          (cd assets && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)
      - name: Publish release
        run: |
          SP=$(tr -d '\r\n ' < SPIRULA_VERSION)
          cat > notes.md <<NOTES
          ## SphereScan ${{ github.ref_name }}
          Download the file for your system, unzip, and double-click. Nothing else to install.

          ### Open source (GPLv3)
          These apps bundle an **unmodified** copy of [Spirula Studio $SP](https://github.com/harry7557558/spirula-studio/releases/tag/$SP) (GPLv3).
          - Source for this SphereScan release: \`spherescan-${{ github.ref_name }}-source.tar.gz\` (attached)
          - Source for the bundled Spirula Studio: \`spirula-studio-$SP-source.tar.gz\` (attached)
          - Licences: \`THIRD_PARTY.md\` and the *Licences and source code* link in the app.
          - Spirula's own notes warn of third-party patent exposure for H.264/H.265 decoding; see \`THIRD_PARTY.md\`.
          - \`spirula-asset-*.sha256\` list the checksums of the official Spirula downloads we bundled.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file notes.md assets/* \
            || gh release upload "${{ github.ref_name }}" assets/* --clobber
